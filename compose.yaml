services:
  disk-service:
    build: .
    container_name: disk-v1
    ports:
      - "8109:8009"
    environment:
      - MESSAGE=Disk online
      - APP_VERSION=1.0
    volumes:
      - disk-data:/data
      - ./readonly-data:/readonly:ro
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  disk-data: