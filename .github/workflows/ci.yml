name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Print version and commit
        run: |
          python --version
          echo "Commit: ${{ github.sha }}"
          
      - name: Compile Python files
        run: python -m py_compile *.py
        
      - name: Check for main function
        run: python -c "import app; assert hasattr(app, 'main'), 'function main not found'"
