name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Print version and commit
        run: |
          python --version
          echo "Commit: ${{ github.sha }}"
      - name: Compile Python files
        run: python -m py_compile *.py
      - name: Check for main function
        run: python -c "import app; assert hasattr(app, 'main'), 'function main not found'"

  unit_tests:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  package:
    needs: unit_tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Create dist directory
        run: mkdir -p dist

      - name: Copy files to dist
        run: |
          cp disk_check.py dist/
          cp README.md dist/
          cp dockerfile dist/
          cp settings.json.example dist/

      - name: Generate manifest
        run: |
          echo "CI_COMMIT_SHA=${{ github.sha }}" > dist/manifest.txt
          echo "CI_PIPELINE_ID=${{ github.run_id }}" >> dist/manifest.txt
          echo "FILES:" >> dist/manifest.txt
          ls -1 dist/ >> dist/manifest.txt
          echo "--- manifest.txt ---"
          cat dist/manifest.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/
          retention-days: 7
