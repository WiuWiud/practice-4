name: CI Pipeline

on:
  push:
    branches: ["main", "experiment/*"]
    tags: ["v*", "rc-*"]
  pull_request:
    branches: ["main"]

env:
  APP_PORT: "8109"

jobs:
  validate:
    runs-on: ubuntu-latest
    continue-on-error: ${{ startsWith(github.ref, 'refs/heads/experiment/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Print version and commit
        run: |
          python --version
          echo "Commit: ${{ github.sha }}"
      - name: Compile Python files
        run: python -m py_compile *.py
      - name: Check for main function
        run: python -c "import app; assert hasattr(app, 'main'), 'function main not found'"

  unit_tests:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  package:
    needs: unit_tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Create dist directory
        run: mkdir -p dist
      - name: Copy files to dist
        run: |
          cp disk_check.py dist/
          cp README.md dist/
          cp dockerfile dist/
          cp settings.json.example dist/
      - name: Generate manifest
        run: |
          echo "CI_COMMIT_SHA=${{ github.sha }}" > dist/manifest.txt
          echo "CI_PIPELINE_ID=${{ github.run_id }}" >> dist/manifest.txt
          echo "FILES:" >> dist/manifest.txt
          ls -1 dist/ >> dist/manifest.txt
          cat dist/manifest.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/
          retention-days: 7

  deploy_test:
    needs: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: test/disk
      url: http://localhost:8109/health
    steps:
      - uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: package
          path: deploy/test

      - name: List deployed files
        run: |
          echo "=== Deployed files in deploy/test ==="
          ls -la deploy/test/

      - name: Check DEPLOY_TOKEN exists (masked)
        run: |
          if [ -z "${{ secrets.DEPLOY_TOKEN }}" ]; then
            echo "DEPLOY_TOKEN is not set"
            exit 1
          fi
          echo "DEPLOY_TOKEN is set (value hidden)"

      - name: Smoke test variant 9 (code 0 at safe threshold)
        run: |
          cd deploy/test
          python -c "from disk_check import check_disk; exit(0 if check_disk(50) == 'ok' else 1)"
          echo "Smoke test passed: safe threshold 50 percent returns exit code 0"

      - name: Generate deployment report
        run: |
          mkdir -p deploy
          echo "DEPLOYMENT REPORT" > deploy/deployment.txt
          echo "===================" >> deploy/deployment.txt
          echo "COMMIT_SHA=${{ github.sha }}" >> deploy/deployment.txt
          echo "PIPELINE_ID=${{ github.run_id }}" >> deploy/deployment.txt
          echo "ENVIRONMENT=test/disk" >> deploy/deployment.txt
          echo "APP_PORT=${{ env.APP_PORT }}" >> deploy/deployment.txt
          echo "STATUS=success" >> deploy/deployment.txt
          echo "DEPLOYED_FILES:" >> deploy/deployment.txt
          ls -1 deploy/test/ >> deploy/deployment.txt
          echo "SMOKE_TEST=passed (code 0 at safe threshold 50 percent)" >> deploy/deployment.txt
          cat deploy/deployment.txt

      - name: Upload deployment report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: deploy/deployment.txt
          retention-days: 7
